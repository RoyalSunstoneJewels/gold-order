<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — ROYAL SUNSTONE JEWELS</title>
  <style>
    :root {
      --navy: #142238;
      --maroon: #5a0710;
      --gold: #c69c53;
      --bg: #f6f3ee;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #6b625b;
      --border: #e5ddd1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
    }

    .topbar {
      background: var(--navy);
      color: #fff;
      padding: 18px 24px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-gold {
      background: var(--gold);
      color: #fff;
    }

    .btn-maroon {
      background: var(--maroon);
      color: #fff;
    }

    .btn-light {
      background: #fff;
      color: var(--navy);
    }

    .login-card, .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(20, 34, 56, 0.05);
    }

    .login-card {
      max-width: 420px;
      margin: 40px auto;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--navy);
    }

    .input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 22px;
    }

    .item-row {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #faf8f5;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .dash-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <h1 style="font-size:20px;">ROYAL SUNSTONE — ADMIN CONTROL</h1>
        <p style="font-size:12px; color:#e7cfa0;">Catalog, Orders &amp; Concierge Management</p>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <a href="./index.html" class="btn btn-light" style="text-decoration:none;">View Storefront</a>
        <button id="logoutBtn" class="btn btn-maroon" style="display:none;">Sign Out</button>
      </div>
    </header>

    <section id="loginSection" class="login-card">
      <h2 style="margin-bottom:8px; color:var(--navy);">Admin Sign In</h2>
      <p class="muted" style="margin-bottom:18px;">Use your Firebase Authentication admin email &amp; password.</p>
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">Admin Email</label>
          <input type="email" id="adminEmail" class="input" required placeholder="admin@example.com" />
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" class="input" required placeholder="Enter password" />
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;">Login to Dashboard</button>
      </form>
      <p id="loginError" style="color:#b91c1c; font-size:13px; margin-top:12px;"></p>
    </section>

    <section id="dashboardSection" style="display:none;">
      <div class="dash-grid">
        <div class="panel">
          <h2 style="margin-bottom:14px; color:var(--navy);">Add Jewelry Product</h2>
          <form id="addProductForm">
            <div class="form-group">
              <label for="prodName">Product Name</label>
              <input type="text" id="prodName" class="input" required placeholder="Royal Sunstone Tiara" />
            </div>
            <div class="form-group">
              <label for="prodCategory">Category</label>
              <select id="prodCategory" class="input">
                <option value="Rings">Rings</option>
                <option value="Necklaces">Necklaces</option>
                <option value="Bracelets">Bracelets</option>
                <option value="Earrings">Earrings</option>
              </select>
            </div>
            <div class="form-group">
              <label for="prodPrice">Price (USD)</label>
              <input type="number" id="prodPrice" class="input" required min="1" step="0.01" value="550" />
            </div>
            <div class="form-group">
              <label for="prodReward">Snatch Reward (USD)</label>
              <input type="number" id="prodReward" class="input" required min="0" step="0.01" value="25" />
            </div>
            <div class="form-group">
              <label for="prodImage">Image Path (optional)</label>
              <input type="text" id="prodImage" class="input" placeholder="./images/ring-1.jpg" />
            </div>
            <div class="form-group">
              <label for="prodDesc">Description</label>
              <textarea id="prodDesc" rows="2" class="input" placeholder="Handcrafted sunstone piece..."></textarea>
            </div>
            <button type="submit" class="btn btn-gold" style="width:100%;">Publish Product</button>
          </form>
        </div>

        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="panel">
            <h2 style="margin-bottom:12px; color:var(--navy);">Live Products</h2>
            <div id="adminProductsList"></div>
          </div>

          <div class="panel">
            <h2 style="margin-bottom:12px; color:var(--navy);">Recent Orders</h2>
            <div id="adminOrdersList"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import { db, auth } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      ref,
      push,
      onValue,
      remove
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const loginSection = document.getElementById("loginSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const logoutBtn = document.getElementById("logoutBtn");
    const loginError = document.getElementById("loginError");

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.textContent = "";
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        loginError.textContent = err.message || "Invalid admin credentials.";
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.style.display = "none";
        dashboardSection.style.display = "block";
        logoutBtn.style.display = "inline-block";
        startAdminListeners();
      } else {
        loginSection.style.display = "block";
        dashboardSection.style.display = "none";
        logoutBtn.style.display = "none";
      }
    });

    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const item = {
        name: document.getElementById("prodName").value.trim(),
        category: document.getElementById("prodCategory").value,
        price: Number(document.getElementById("prodPrice").value || 0),
        reward: Number(document.getElementById("prodReward").value || 0),
        image: document.getElementById("prodImage").value.trim(),
        description: document.getElementById("prodDesc").value.trim()
      };
      try {
        await push(ref(db, "products"), item);
        e.target.reset();
        alert("Product published to live catalog!");
      } catch (err) {
        alert("Error saving product: " + err.message);
      }
    });

    function startAdminListeners() {
      const prodListEl = document.getElementById("adminProductsList");
      const ordListEl = document.getElementById("adminOrdersList");

      onValue(ref(db, "products"), (snap) => {
        if (!snap.exists()) {
          prodListEl.innerHTML = `<p class="muted">No products in database yet.</p>`;
          return;
        }
        const entries = Object.entries(snap.val());
        prodListEl.innerHTML = entries
          .map(
            ([id, p]) => `
              <div class="item-row">
                <div>
                  <strong>${escapeHtml(p.name)}</strong>
                  <div class="muted">${escapeHtml(p.category)} &bull; $${Number(p.price).toFixed(2)}</div>
                </div>
                <button class="btn btn-maroon" data-del-id="${escapeHtml(id)}">Delete</button>
              </div>
            `
          )
          .join("");

        prodListEl.querySelectorAll("[data-del-id]").forEach((btn) => {
          btn.addEventListener("click", () => {
            remove(ref(db, `products/${btn.dataset.delId}`));
          });
        });
      });

      onValue(ref(db, "orders"), (snap) => {
        if (!snap.exists()) {
          ordListEl.innerHTML = `<p class="muted">No orders recorded yet.</p>`;
          return;
        }
        const orders = Object.values(snap.val()).reverse().slice(0, 10);
        ordListEl.innerHTML = orders
          .map(
            (o) => `
              <div class="item-row">
                <div>
                  <strong>${escapeHtml(o.itemName)}</strong>
                  <div class="muted">${escapeHtml(o.userEmail || "Guest")} &bull; $${Number(o.price).toFixed(2)}</div>
                </div>
                <span class="muted">${escapeHtml(o.status || "Confirmed")}</span>
              </div>
            `
          )
          .join("");
      });
    }
  </script>
</body>
</html>
