<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Panel — ROYAL SUNSTONE JEWELS</title>
  <style>
    :root {
      --navy: #0b1628;
      --maroon: #5a0710;
      --gold: #c69c53;
      --bg: #f6f3ee;
      --card: #ffffff;
      --border: #e5ddd1;
      --muted: #6b625b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #1c1917;
      padding: 24px 16px;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
    }

    .topbar {
      background: var(--navy);
      color: #fff;
      padding: 18px 24px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-gold {
      background: var(--gold);
      color: #fff;
    }

    .btn-maroon {
      background: var(--maroon);
      color: #fff;
    }

    .btn-light {
      background: #fff;
      color: var(--navy);
    }

    .panel, .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
    }

    .login-card {
      max-width: 420px;
      margin: 36px auto;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 20px;
    }

    .item-row {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #faf8f5;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .dash-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <h1 style="font-size:19px;">ROYAL SUNSTONE — CONTROL PANEL</h1>
        <p style="font-size:12px; color:#e7cfa0;">Telegram, WhatsApp, Products &amp; Pay Out Requests</p>
      </div>
      <div style="display:flex; gap:10px;">
        <a href="./index.html" class="btn btn-light" style="text-decoration:none;">Storefront</a>
        <button id="logoutBtn" class="btn btn-maroon" style="display:none;">Sign Out</button>
      </div>
    </header>

    <section id="loginSection" class="login-card">
      <h2 style="margin-bottom:8px;">Admin Sign In</h2>
      <p class="muted" style="margin-bottom:16px;">Sign in with your Firebase admin email &amp; password.</p>
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" class="input" required />
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" class="input" required />
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;">Login</button>
      </form>
      <p id="loginError" style="color:#dc2626; font-size:13px; margin-top:10px;"></p>
    </section>

    <section id="dashboardSection" style="display:none;">
      <div class="dash-grid">
        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="panel">
            <h2 style="margin-bottom:12px;">Contact Us Channels</h2>
            <form id="supportForm">
              <div class="form-group">
                <label for="tgInput">Telegram Link</label>
                <input type="url" id="tgInput" class="input" required placeholder="https://t.me/username" />
              </div>
              <div class="form-group">
                <label for="waInput">WhatsApp Number (with country code)</label>
                <input type="text" id="waInput" class="input" required placeholder="8801712345678" />
              </div>
              <button type="submit" class="btn btn-gold" style="width:100%;">Save Contact Channels</button>
            </form>
          </div>

          <div class="panel">
            <h2 style="margin-bottom:12px;">Add Jewelry Item</h2>
            <form id="addProdForm">
              <div class="form-group">
                <label for="pName">Product Name</label>
                <input type="text" id="pName" class="input" required />
              </div>
              <div class="form-group">
                <label for="pCat">Category</label>
                <select id="pCat" class="input">
                  <option value="Rings">Rings</option>
                  <option value="Necklaces">Necklaces</option>
                  <option value="Bracelets">Bracelets</option>
                  <option value="Earrings">Earrings</option>
                </select>
              </div>
              <div class="form-group">
                <label for="pPrice">Price (USD)</label>
                <input type="number" id="pPrice" class="input" required min="1" step="0.01" value="500" />
              </div>
              <div class="form-group">
                <label for="pReward">Reward (BDT)</label>
                <input type="number" id="pReward" class="input" required min="0" step="0.01" value="20" />
              </div>
              <div class="form-group">
                <label for="pImg">Image Path (optional)</label>
                <input type="text" id="pImg" class="input" placeholder="./images/ring-1.jpg" />
              </div>
              <div class="form-group">
                <label for="pDesc">Description</label>
                <textarea id="pDesc" rows="2" class="input"></textarea>
              </div>
              <button type="submit" class="btn btn-gold" style="width:100%;">Publish</button>
            </form>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="panel">
            <h2 style="margin-bottom:12px;">Pay Out Requests</h2>
            <div id="payoutsBox"></div>
          </div>

          <div class="panel">
            <h2 style="margin-bottom:12px;">Published Products</h2>
            <div id="prodsBox"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import { db, auth } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      ref,
      set,
      push,
      onValue,
      remove
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const loginSection = document.getElementById("loginSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const logoutBtn = document.getElementById("logoutBtn");
    const loginError = document.getElementById("loginError");

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.textContent = "";
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("adminEmail").value.trim(),
          document.getElementById("adminPassword").value
        );
      } catch (err) {
        loginError.textContent = err.message || "Sign in failed.";
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.style.display = "none";
        dashboardSection.style.display = "block";
        logoutBtn.style.display = "inline-block";
        startSync();
      } else {
        loginSection.style.display = "block";
        dashboardSection.style.display = "none";
        logoutBtn.style.display = "none";
      }
    });

    document.getElementById("supportForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const telegramUrl = document.getElementById("tgInput").value.trim();
      const whatsappNumber = document.getElementById("waInput").value.trim().replace(/\D/g, "");
      await set(ref(db, "support_config"), { telegramUrl, whatsappNumber });
      alert("Contact channels updated!");
    });

    document.getElementById("addProdForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await push(ref(db, "products"), {
        name: document.getElementById("pName").value.trim(),
        category: document.getElementById("pCat").value,
        price: Number(document.getElementById("pPrice").value || 0),
        reward: Number(
