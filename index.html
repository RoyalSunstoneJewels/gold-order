<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROYAL SUNSTONE — JEWELS | Crafted for Royalty</title>
  <style>
    :root {
      --ink: #141414;
      --muted: #666666;
      --line: #e6e3dd;
      --bg: #ffffff;
      --soft: #f7f5f0;
      --navy: #0b1628;
      --purple: #4a0e78;
      --gold: #c69c53;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    #mainStorefrontView.hidden-page {
      display: none;
    }

    .top-utility {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
    }

    .util-left, .util-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .util-btn {
      background: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }

    .util-btn.primary {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .main-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 14px 24px 10px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .menu-3line-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--ink);
      padding: 4px 8px;
    }

    .brand-wordmark {
      text-align: center;
      cursor: pointer;
    }

    .brand-main {
      font-size: 24px;
      letter-spacing: 5px;
      font-weight: 500;
      color: var(--ink);
    }

    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .top-cat-nav {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #f2efe9;
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #333;
    }

    .top-cat-nav button {
      background: none;
      border: none;
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }

    .top-cat-nav button:hover {
      color: var(--gold);
    }

    .bf-hero {
      position: relative;
      background: radial-gradient(circle at 65% 40%, #2c2419 0%, #090909 70%);
      color: #fff;
      padding: 64px 24px 54px;
      text-align: center;
    }

    .bf-title-top {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(42px, 8vw, 96px);
      font-weight: 900;
      letter-spacing: 4px;
      line-height: 0.96;
      background: linear-gradient(135deg, #f5e6c4 0%, #d4af6a 45%, #fff6df 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .bf-sub-row {
      margin-top: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .bf-upto {
      font-size: clamp(20px, 3vw, 34px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #f3e4c3;
    }

    .bf-off-big {
      font-size: clamp(46px, 8vw, 96px);
      font-weight: 900;
      line-height: 0.95;
      background: linear-gradient(135deg, #e7c98b 0%, #ffffff 55%, #c69c53 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bf-jewel-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(22px, 3.5vw, 38px);
      font-weight: 800;
      letter-spacing: 5px;
      color: #e6cfa0;
      margin-top: 6px;
    }

    .shop-now-white-btn {
      margin-top: 26px;
      background: #fff;
      color: #111;
      border: none;
      padding: 12px 34px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .hero-down-chevron {
      display: block;
      margin: 22px auto 0;
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 20px;
      cursor: pointer;
    }

    .section-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 56px 24px;
    }

    .section-heading-center {
      text-align: center;
      margin-bottom: 28px;
    }

    .section-heading-center h2 {
      font-size: 24px;
      letter-spacing: 3px;
      font-weight: 500;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section-heading-center p {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    .three-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .showcase-tile {
      background: var(--soft);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .showcase-tile-img {
      width: 100%;
      height: 290px;
      object-fit: cover;
      background: #eae5dc;
    }

    .showcase-tile-body {
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .two-feature-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .feature-box-card {
      border: 1px solid var(--line);
      background: #fff;
    }

    .feature-box-img {
      width: 100%;
      height: 310px;
      object-fit: cover;
      background: #e9e4da;
    }

    .feature-box-content {
      padding: 22px;
    }

    .feature-box-content h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .feature-box-content p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .outline-btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ghost-rect-btn {
      background: #fff;
      border: 1px solid #b5b0a6;
      padding: 10px 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .exclusive-band {
      background: #f6f7f9;
      padding: 52px 24px;
    }

    .carousel-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .carousel-arrow {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #555;
      padding: 4px 8px;
    }

    .carousel-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .carousel-dot {
      width: 10px;
      height: 4px;
      border-radius: 2px;
      background: #bbb;
      border: none;
      cursor: pointer;
    }

    .carousel-dot.active {
      width: 18px;
      background: #111;
    }

    .exclusive-banner-box {
      position: relative;
      max-width: 1040px;
      margin: 0 auto;
      height: 430px;
      overflow: hidden;
      background: #2b241c;
    }

    .exclusive-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.88;
    }

    .exclusive-overlay-text {
      position: absolute;
      left: 48px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      max-width: 440px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
    }

    .exclusive-overlay-text h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .shop-collection-ghost {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid #fff;
      padding: 10px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .editorial-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      margin-bottom: 48px;
    }

    .editorial-text h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .editorial-text p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .editorial-link-btn {
      background: none;
      border: none;
      border-bottom: 1px solid #444;
      padding-bottom: 3px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .editorial-img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #ece7de;
    }

    #snatchDedicatedPage {
      display: none;
      min-height: 100vh;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #snatchDedicatedPage.active {
      display: block;
    }

    .snatch-page-topbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 45;
    }

    .snatch-page-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 18px 48px;
    }

    .tab-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 6px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: 700;
      color: #4b5563;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: #111827;
      border-bottom-color: #111827;
    }

    .queue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 6px;
      border-bottom: 1px solid #eceef2;
    }

    .queue-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .queue-num {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      width: 24px;
      text-align: center;
    }

    .queue-thumb {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .balance-warning-box {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .action-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .start-batch-btn {
      width: 100%;
      margin-top: 12px;
      padding: 16px 20px;
      border-radius: 10px;
      border: none;
      background: #0b1628;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .start-batch-btn.locked {
      background: #6b7280;
    }

    .digging-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.56);
      z-index: 130;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .digging-overlay.open {
      display: flex;
    }

    .digging-card {
      background: #fff;
      border-radius: 16px;
      padding: 34px 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      min-width: 260px;
    }

    .spinner-ring-disc {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #e2e8f0;
      position: relative;
      display: grid;
      place-items: center;
    }

    .spinner-ring-disc::before {
      content: "";
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 4px dashed #64748b;
      animation: spinClockwise 1.1s linear infinite;
    }

    .spinner-center-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
    }

    .digging-title {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 6px;
    }

    .dots-pulse {
      font-size: 20px;
      letter-spacing: 3px;
      color: #111827;
      animation: pulseFade 0.9s ease-in-out infinite;
    }

    @keyframes spinClockwise {
      to { transform: rotate(360deg); }
    }

    @keyframes pulseFade {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .luxury-splash-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 42%, #182746 0%, #0b1326 75%);
      z-index: 140;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .luxury-splash-overlay.open {
      display: flex;
    }

    .orbital-stage {
      position: relative;
      width: 170px;
      height: 170px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
    }

    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.28);
    }

    .orbit-ring.outer {
      width: 164px;
      height: 164px;
      animation: spinClockwise 5s linear infinite;
    }

    .orbit-ring.middle {
      width: 122px;
      height: 122px;
      border-color: rgba(212, 175, 55, 0.55);
      animation: spinCounter 3.5s linear infinite;
    }

    .orbit-ring.inner {
      width: 84px;
      height: 84px;
      border-color: rgba(212, 175, 55, 0.85);
    }

    .orbit-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f5d061;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
    }

    .gold-core-square {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #f5d061 0%, #c69c53 60%, #8f6724 100%);
      box-shadow: 0 0 22px rgba(212, 175, 55, 0.45);
    }

    .splash-brand-title {
      font-size: 24px;
      letter-spacing: 6px;
      font-weight: 500;
      color: #f3d27a;
      text-transform: uppercase;
    }

    .splash-brand-sub {
      font-size: 11px;
      letter-spacing: 3.5px;
      color: #6b7ea8;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .splash-dots {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .splash-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d4af37;
      animation: pulseFade 1s infinite;
    }

    .splash-rule-line {
      width: 180px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      margin-top: 20px;
    }

    @keyframes spinCounter {
      to { transform: rotate(-360deg); }
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 80;
      display: none;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      left: -380px;
      width: 360px;
      max-width: 92vw;
      height: 100%;
      background: #fff;
      z-index: 90;
      transition: left 0.25s ease;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .side-drawer.open {
      left: 0;
    }

    .avatar-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #d1d5db;
      display: grid;
